spring.application.name=biblioteca-api
# URL por defecto para ejecución local (Docker Compose con MariaDB en puerto 3307)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3307/biblioteca}
spring.datasource.username=biblioteca
spring.datasource.password=biblioteca
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
